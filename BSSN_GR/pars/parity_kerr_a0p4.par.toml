TPID_PAR_B = 0.5
TPID_CENTER_OFFSET = { X = 0.0, Y = 0.0, Z = 0.0 }
TPID_GIVE_BARE_MASS = 1
TPID_TARGET_M_PLUS = 1.0
TPID_TARGET_M_MINUS = 0.0
TPID_NPOINTS_A = 65
TPID_NPOINTS_B = 78
TPID_NPOINTS_PHI = 10
TPID_NEWTON_TOL = 1.6e-14
TPID_ADM_TOL = 3e-16
TPID_VERBOSE = 0
